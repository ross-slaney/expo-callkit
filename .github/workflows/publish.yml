name: Publish public npm package

on:
  release:
    types: [published]

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust only a reviewed main-branch release commit
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "Release tag resolves to $tag_commit, but checkout HEAD is $head_commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main; then
            echo "Release commit is not on origin/main; refusing to execute package scripts."
            exit 1
          fi

          checks_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits/$head_commit/check-runs" -f filter=latest -f per_page=100)"
          required_checks=(
            "check"
            "iOS lifecycle tests + SDK 54 smoke build"
            "Android native tests + SDK 54 smoke build"
          )
          for check_name in "${required_checks[@]}"; do
            conclusion="$(jq -r --arg name "$check_name" '[.check_runs[] | select(.name == $name)] | max_by(.completed_at // "") | .conclusion // ""' <<< "$checks_json")"
            if [ "$conclusion" != "success" ]; then
              echo "Required check '$check_name' is '$conclusion', not 'success'."
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          registry-url: "https://registry.npmjs.org"
      - name: Pin provenance-capable npm
        run: npm install --global npm@11.18.0
      # npm ci runs prepare, building both JS output and the config plugin.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci --runInBand
        env:
          CI: true
      - run: npm run lint
        env:
          CI: true
      - run: npm run verify:package
      - name: Validate release tag, version, changelog, and commit
        run: npm run verify:release -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Reject an already-published version
        shell: bash
        run: |
          package_spec="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          if npm view "$package_spec" version --registry=https://registry.npmjs.org > /tmp/npm-view.out 2> /tmp/npm-view.err; then
            echo "$package_spec is already published; refusing to overwrite it."
            exit 1
          fi
          if ! grep -q 'E404' /tmp/npm-view.err; then
            cat /tmp/npm-view.err
            echo "Could not prove that $package_spec is unpublished."
            exit 1
          fi
      - name: Verify npm credentials
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish with public access and provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
