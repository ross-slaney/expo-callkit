name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      # npm ci runs "prepare" (expo-module prepare), which builds both the
      # module (build/) and the config plugin (plugin/build/).
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
        env:
          CI: true
      - run: npm run lint
        env:
          CI: true

  ios-lifecycle:
    name: iOS lifecycle tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
